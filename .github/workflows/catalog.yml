name: catalog

on:
  schedule:
    - cron: "17 3 * * *" # daily catalogue rebuild
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - WIKI.yaml
      - WIKI.schema.json
      - scripts/**
      - .github/workflows/catalog.yml

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate manifest
        run: python scripts/validate_manifest.py

      - name: Build catalogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_catalog.py --repo "$GITHUB_REPOSITORY"

      - name: Commit catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CATALOG.md CATALOG.json
          if git diff --cached --quiet; then
            echo "Catalogue unchanged."
          else
            git commit -m "chore: rebuild catalogue"
            git push
          fi
